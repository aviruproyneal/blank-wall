<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blank Wall</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="wall.css">
  </head>
  <body>
    <main class="wall">
      <p class="wall__timer" id="timer" aria-live="polite">05:00</p>

      <div class="wall__tools" id="tools" hidden>
        <button class="wall__tool" id="note-button" type="button" aria-label="Take a note" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 20h4l11-11-4-4L4 16v4z"></path>
            <path d="M13 7l4 4"></path>
          </svg>
        </button>
        <button class="wall__tool" id="habit-button" type="button" aria-label="Log habit" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 12a8 8 0 0 1 14-5"></path>
            <path d="M18 4v4h-4"></path>
            <path d="M20 12a8 8 0 0 1-14 5"></path>
            <path d="M6 20v-4h4"></path>
          </svg>
        </button>
        <button class="wall__tool wall__tool--text" id="skip-button" type="button" hidden>Skip</button>
      </div>

      <section class="wall__decision" id="decision" hidden>
        <p>Still want to go in?</p>
        <div class="wall__actions">
          <button id="continue" type="button">Continue</button>
          <button id="leave" type="button">Leave</button>
        </div>
      </section>
    </main>

    <section class="note-box" id="note-box" aria-label="Quick note" hidden>
      <div class="note-box__header">
        <span>Quick note</span>
        <span id="note-countdown">01:00</span>
      </div>
      <textarea id="note-text" rows="5" placeholder="What are you reaching for?" spellcheck="true"></textarea>
      <div class="note-box__actions">
        <button id="save-note" type="button" disabled>Save</button>
      </div>
    </section>

    <section class="habit-box" id="habit-box" aria-label="Log habit" hidden>
      <form id="habit-form">
        <div class="habit-box__header">
          <span>Log habit</span>
          <select id="habit-select" aria-label="Habit"></select>
        </div>

        <div class="habit-box__fields" id="habit-fields">
          <label>
            <span>Title</span>
            <input id="habit-title" type="text" placeholder="Short title" required>
          </label>
          <label>
            <span>Trigger</span>
            <input id="habit-trigger" type="text" required>
          </label>
          <label>
            <span>Response</span>
            <input id="habit-response" type="text" required>
          </label>
          <label>
            <span>Reward</span>
            <input id="habit-reward" type="text" required>
          </label>
          <label>
            <span>Counter-plan</span>
            <textarea id="habit-counter" rows="2" required></textarea>
          </label>
        </div>

        <label class="habit-box__checkbox">
          <input id="habit-counter-used" type="checkbox">
          <span>Counter plan used</span>
        </label>

        <div class="habit-box__actions">
          <button id="cancel-habit" type="button">Cancel</button>
          <button id="save-habit" type="submit">Save</button>
        </div>
      </form>
    </section>

    <script type="module" src="wall.js"></script>
  </body>
</html>
