<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blank Wall</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <h1>Blank Wall</h1>
        <p class="popup__hostname" id="hostname">Reading this tab…</p>
      </header>

      <button id="toggle-site" type="button" disabled>Block this site</button>

      <section class="popup__section">
        <h2>Today</h2>
        <dl class="stats">
          <div>
            <dt>Walls faced</dt>
            <dd id="walls">0</dd>
          </div>
          <div>
            <dt>On the wall</dt>
            <dd id="wall-time">0 min</dd>
          </div>
          <div>
            <dt>Skips</dt>
            <dd id="skips">0</dd>
          </div>
        </dl>
      </section>

      <p class="popup__backup" id="backup-status">Backup: not set</p>

      <div class="popup__nav">
        <button id="quick-note" type="button">Quick note</button>
        <button id="log-habit" type="button">Log habit</button>
        <button id="open-dashboard" type="button">Open dashboard</button>
        <button id="open-guide" type="button">Guide</button>
      </div>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
