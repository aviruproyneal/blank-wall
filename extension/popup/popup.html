<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blank Wall</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/components.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <h1>Blank Wall</h1>
        <p class="popup__hostname" id="hostname">Reading this tab…</p>
      </header>

      <button class="button button--primary" id="toggle-site" type="button" disabled>Block this site</button>

      <section class="popup__section">
        <h2>Today</h2>
        <dl class="stats">
          <div>
            <dt>Walls faced</dt>
            <dd id="walls">0</dd>
          </div>
          <div>
            <dt>On the wall</dt>
            <dd id="wall-time">0 min</dd>
          </div>
          <div>
            <dt>Skips</dt>
            <dd id="skips">0</dd>
          </div>
        </dl>
      </section>

      <p class="popup__backup" id="backup-status">Backup: not set</p>

      <div class="popup__nav">
        <button class="button button--secondary" id="quick-note" type="button"><svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#icon-note"></use></svg>Quick note</button>
        <button class="button button--secondary" id="log-habit" type="button"><svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#icon-habit"></use></svg>Log habit</button>
        <button class="button button--secondary" id="open-dashboard" type="button"><svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#icon-dashboard"></use></svg>Open dashboard</button>
        <button class="button button--secondary" id="open-guide" type="button"><svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#icon-guide"></use></svg>Guide</button>
      </div>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
