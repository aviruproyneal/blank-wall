<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blank Wall Dashboard</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="dashboard.css">
  </head>
  <body>
    <main class="dashboard">
      <h1>Dashboard</h1>

      <section class="panel">
        <h2>Today</h2>
        <dl class="stats">
          <div>
            <dt>Walls faced</dt>
            <dd id="walls">0</dd>
          </div>
          <div>
            <dt>On the wall</dt>
            <dd id="wall-time">0 min</dd>
          </div>
          <div>
            <dt>Skips</dt>
            <dd id="skips">0</dd>
          </div>
        </dl>
      </section>

      <section class="panel">
        <h2>Blocked sites</h2>
        <p><strong id="site-count">0</strong> sites blocked</p>
      </section>
    </main>

    <script type="module" src="dashboard.js"></script>
  </body>
</html>
